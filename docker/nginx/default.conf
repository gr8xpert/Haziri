# Catch-all vhost: *.hazri.localhost (tenants), admin./adms./api. (central) all hit Laravel,
# which decides central vs tenant from the Host header — same as the Plesk wildcard setup.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/public;
    index index.php;
    client_max_body_size 24M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
